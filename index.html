<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIX Vuln 11: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data: https: blob:;
              connect-src 'self' http://localhost:3000 
              http://localhost:5173
              https://drive.google.com 
              https://www.googleapis.com 
              https://uploadct.googleapis.com 
              https://script.google.com 
              https://script.googleusercontent.com 
              https://ui-avatars.com;
              frame-src 'none';
              object-src 'none';
              base-uri 'self';
              form-action 'self';" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sciusnu-smart</title>
    <script>
      // FIX Vuln 3: Only read theme (non-sensitive) from localStorage.
      // Role is never read here — the React app verifies auth via JWT.
      (function () {
        var root = document.documentElement;
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') root.classList.add('dark');
        root.classList.add('page-login'); // default; React will update
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
