<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">ขั้นตอนนักเรียนส่งไฟล์แก้ไข</title>
  <desc id="desc">แสดงขั้นตอนอ่านหมายเหตุ กดส่งไฟล์แก้ไข แนบไฟล์ใหม่ และรอตรวจอีกครั้ง</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#e11d48" stroke-width="2"/></marker>
  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.rose{fill:#fff1f2;stroke:#fecdd3}.blue{fill:#eff6ff;stroke:#bfdbfe}.green{fill:#ecfdf5;stroke:#bbf7d0}.title{font-family:Arial,sans-serif;font-size:30px;font-weight:800;fill:#111827}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:800;fill:#1f2937}.text{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}.small{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b}.n{font-family:Arial,sans-serif;font-size:15px;font-weight:800;fill:#fff}.dot{fill:#e11d48}.arr{stroke:#e11d48;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1100" height="560"/><rect class="panel" x="40" y="32" width="1020" height="496" rx="30"/>
  <text class="title" x="76" y="82">นักเรียน: ขั้นตอนส่งไฟล์แก้ไข</text>
  <rect class="rose" x="82" y="142" width="210" height="130" rx="22"/><circle class="dot" cx="110" cy="176" r="16"/><text class="n" x="104" y="182">1</text><text class="label" x="134" y="180">อ่านหมายเหตุ</text><text class="text" x="106" y="218">ดูข้อความจากอาจารย์</text><text class="text" x="106" y="242">ในคอลัมน์หมายเหตุ</text>
  <rect class="blue" x="342" y="142" width="210" height="130" rx="22"/><circle class="dot" cx="370" cy="176" r="16"/><text class="n" x="364" y="182">2</text><text class="label" x="394" y="180">กดส่งไฟล์แก้ไข</text><text class="text" x="366" y="218">กดจากรายการที่</text><text class="text" x="366" y="242">ไม่อนุมัติเท่านั้น</text>
  <rect class="blue" x="602" y="142" width="210" height="130" rx="22"/><circle class="dot" cx="630" cy="176" r="16"/><text class="n" x="624" y="182">3</text><text class="label" x="654" y="180">แนบ PDF ใหม่</text><text class="text" x="626" y="218">ระบบล็อกประเภทงาน</text><text class="text" x="626" y="242">ให้ตรงรายการเดิม</text>
  <rect class="green" x="862" y="142" width="170" height="130" rx="22"/><circle cx="890" cy="176" r="16" fill="#059669"/><text class="n" x="884" y="182">4</text><text class="label" x="914" y="180">รอตรวจ</text><text class="text" x="886" y="218">หมายเหตุเดิม</text><text class="text" x="886" y="242">ยังแสดงอยู่</text>
  <path class="arr" d="M296 206 H336"/><path class="arr" d="M556 206 H596"/><path class="arr" d="M816 206 H856"/>
  <rect x="92" y="350" width="940" height="96" rx="20" fill="#f8fafc" stroke="#e5e7eb"/>
  <text class="label" x="122" y="386">อีเมลหลังส่งไฟล์แก้ไข</text>
  <text class="text" x="122" y="416">Code.gs จะส่งอีเมลเหมือนการส่งงานใหม่: แจ้งอาจารย์ที่ปรึกษาหลักให้ตรวจ และแจ้งเพื่อทราบถึงที่ปรึกษาร่วม/โรงเรียน</text>
  <text class="text" x="122" y="440">นักเรียนในกลุ่มจะได้รับอีเมลยืนยันว่าส่งงานเรียบร้อยแล้ว</text>
</svg>
