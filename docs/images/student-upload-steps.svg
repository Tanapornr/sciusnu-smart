<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">ขั้นตอนนักเรียนอัปโหลดงาน</title>
  <desc id="desc">แสดงขั้นตอนเลือกประเภทงาน แนบไฟล์ PDF อัปโหลด และตรวจประวัติ</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f97316" stroke-width="2"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.step{fill:#fff7ed;stroke:#fed7aa}.done{fill:#ecfdf5;stroke:#bbf7d0}.title{font-family:Arial,sans-serif;font-size:30px;font-weight:800;fill:#111827}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:800;fill:#1f2937}.text{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}.small{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b}.n{font-family:Arial,sans-serif;font-size:15px;font-weight:800;fill:#fff}.dot{fill:#f97316}.arr{stroke:#f97316;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="560"/>
  <rect class="panel" x="40" y="32" width="1020" height="496" rx="30"/>
  <text class="title" x="76" y="82">นักเรียน: ขั้นตอนอัปโหลดงานครั้งแรก</text>
  <rect class="step" x="86" y="150" width="180" height="118" rx="22"/><circle class="dot" cx="114" cy="184" r="16"/><text class="n" x="108" y="190">1</text><text class="label" x="138" y="188">เลือกประเภท</text><text class="text" x="110" y="226">โครงร่าง / ก้าวหน้า</text><text class="text" x="110" y="250">ฉบับสมบูรณ์ / คำร้อง</text>
  <rect class="step" x="328" y="150" width="180" height="118" rx="22"/><circle class="dot" cx="356" cy="184" r="16"/><text class="n" x="350" y="190">2</text><text class="label" x="380" y="188">แนบไฟล์</text><text class="text" x="352" y="226">เลือกไฟล์ PDF</text><text class="text" x="352" y="250">จากเครื่อง</text>
  <rect class="step" x="570" y="150" width="180" height="118" rx="22"/><circle class="dot" cx="598" cy="184" r="16"/><text class="n" x="592" y="190">3</text><text class="label" x="622" y="188">กดอัปโหลด</text><text class="text" x="594" y="226">รอระบบบันทึก</text><text class="text" x="594" y="250">ไฟล์และสถานะ</text>
  <rect class="done" x="812" y="150" width="180" height="118" rx="22"/><circle cx="840" cy="184" r="16" fill="#059669"/><text class="n" x="834" y="190">4</text><text class="label" x="864" y="188">ตรวจประวัติ</text><text class="text" x="836" y="226">สถานะเป็น</text><text class="text" x="836" y="250">รอตรวจ/รออนุมัติ</text>
  <path class="arr" d="M270 210 H322"/><path class="arr" d="M512 210 H564"/><path class="arr" d="M754 210 H806"/>
  <rect x="110" y="350" width="860" height="92" rx="20" fill="#f8fafc" stroke="#e5e7eb"/>
  <text class="label" x="140" y="386">หลังอัปโหลดสำเร็จ ระบบส่งอีเมลแจ้งเตือน</text>
  <text class="text" x="140" y="416">งานปกติ: แจ้งอาจารย์ที่ปรึกษาหลัก และแจ้งเพื่อทราบถึงที่ปรึกษาร่วม/ที่ปรึกษาโรงเรียน</text>
  <text class="text" x="140" y="440">แบบคำร้อง: แจ้งแอดมิน และส่งอีเมลยืนยันให้นักเรียนในกลุ่ม</text>
</svg>
