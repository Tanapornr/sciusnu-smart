<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">แผนผังอีเมลแจ้งเตือนในระบบ</title>
  <desc id="desc">แสดงผู้รับอีเมลจากเหตุการณ์ส่งงาน ส่งแบบคำร้อง ตรวจงาน อนุมัติ ไม่อนุมัติ และส่งไฟล์แก้ไข</desc>
  <defs><style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.event{fill:#fff7ed;stroke:#fed7aa}.mail{fill:#eff6ff;stroke:#bfdbfe}.ok{fill:#ecfdf5;stroke:#bbf7d0}.bad{fill:#fff1f2;stroke:#fecdd3}
    .title{font-family:Arial,sans-serif;font-size:30px;font-weight:800;fill:#111827}.label{font-family:Arial,sans-serif;font-size:18px;font-weight:800;fill:#1f2937}.text{font-family:Arial,sans-serif;font-size:13.5px;font-weight:500;fill:#475569}.small{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b}
  </style></defs>
  <rect class="bg" width="1200" height="760"/><rect class="panel" x="42" y="34" width="1116" height="686" rx="32"/>
  <text class="title" x="80" y="84">แผนผังอีเมลแจ้งเตือนตาม Code.gs</text>
  <text class="small" x="80" y="112">ระบบใช้ MailApp.sendEmail ส่งอีเมลอัตโนมัติเมื่อมีเหตุการณ์สำคัญ</text>

  <rect class="event" x="80" y="158" width="230" height="92" rx="20"/><text class="label" x="108" y="194">นักเรียนส่งงานปกติ</text><text class="text" x="108" y="222">Proposal / Progress / Final</text>
  <rect class="mail" x="360" y="142" width="310" height="124" rx="20"/><text class="label" x="390" y="178">ผู้รับอีเมล</text><text class="text" x="390" y="208">ที่ปรึกษาหลัก: รอตรวจสอบ</text><text class="text" x="390" y="232">ที่ปรึกษาร่วม/โรงเรียน: แจ้งเพื่อทราบ</text><text class="text" x="390" y="256">นักเรียนในกลุ่ม: ส่งงานสำเร็จ</text>

  <rect class="event" x="80" y="302" width="230" height="92" rx="20"/><text class="label" x="108" y="338">นักเรียนส่งแบบคำร้อง</text><text class="text" x="108" y="366">ประเภทงาน = แบบคำร้อง</text>
  <rect class="mail" x="360" y="286" width="310" height="124" rx="20"/><text class="label" x="390" y="322">ผู้รับอีเมล</text><text class="text" x="390" y="352">แอดมินทุกคนใน ADMIN_EMAILS</text><text class="text" x="390" y="376">นักเรียนในกลุ่ม: ส่งงานสำเร็จ</text>

  <rect class="ok" x="80" y="446" width="230" height="92" rx="20"/><text class="label" x="108" y="482">อนุมัติงาน</text><text class="text" x="108" y="510">ที่ปรึกษาหลักหรือแอดมิน</text>
  <rect class="mail" x="360" y="430" width="310" height="124" rx="20"/><text class="label" x="390" y="466">ผู้รับอีเมล</text><text class="text" x="390" y="496">นักเรียนในกลุ่ม: ผลการพิจารณา</text><text class="text" x="390" y="520">อาจารย์ทุกบทบาท: แจ้งผล/แจ้งเพื่อทราบ</text>

  <rect class="bad" x="720" y="158" width="230" height="92" rx="20"/><text class="label" x="748" y="194">ไม่อนุมัติงาน</text><text class="text" x="748" y="222">มีหมายเหตุให้แก้ไข</text>
  <rect class="mail" x="720" y="286" width="310" height="124" rx="20"/><text class="label" x="750" y="322">ผู้รับอีเมล</text><text class="text" x="750" y="352">นักเรียนในกลุ่ม: ผลการพิจารณา</text><text class="text" x="750" y="376">แนบเหตุผลที่ต้องแก้ไข</text><text class="text" x="750" y="400">อาจารย์ที่เกี่ยวข้อง: แจ้งผลล่าสุด</text>

  <rect class="event" x="720" y="446" width="230" height="92" rx="20"/><text class="label" x="748" y="482">ส่งไฟล์แก้ไข</text><text class="text" x="748" y="510">หลังถูกไม่อนุมัติ</text>
  <rect class="mail" x="720" y="574" width="310" height="88" rx="20"/><text class="label" x="750" y="608">ผู้รับอีเมล</text><text class="text" x="750" y="638">เหมือนการส่งงานใหม่ และคงหมายเหตุเดิม</text>
</svg>
