<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ภาพประกอบคู่มือนักเรียน</title>
  <desc id="desc">ภาพจำลองหน้าจอนักเรียนพร้อมกรอบอธิบายส่วนอัปโหลด สถานะ และการส่งไฟล์แก้ไข</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .screen { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; filter: url(#shadow); }
      .bar { fill: #f1f5f9; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; }
      .soft { fill: #fff7ed; stroke: #fed7aa; }
      .blue { fill: #eff6ff; stroke: #bfdbfe; }
      .rose { fill: #fff1f2; stroke: #fecdd3; }
      .green { fill: #ecfdf5; stroke: #bbf7d0; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #111827; }
      .label { font-family: Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #1f2937; }
      .text { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .small { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #64748b; }
      .call { font-family: Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
      .orange { fill: #f97316; }
      .line { stroke: #f97316; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect class="screen" x="48" y="40" width="1104" height="680" rx="34"/>
  <rect class="bar" x="48" y="40" width="1104" height="72" rx="34"/>
  <text class="title" x="88" y="88">คู่มือนักเรียน: ส่งงานและส่งไฟล์แก้ไข</text>

  <rect class="panel" x="88" y="148" width="320" height="234" rx="24"/>
  <text class="label" x="118" y="190">อัปโหลดส่งงาน</text>
  <text class="small" x="118" y="226">ประเภทงาน</text>
  <rect x="118" y="242" width="250" height="44" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="text" x="138" y="270">โครงร่าง (Proposal)</text>
  <rect class="soft" x="118" y="306" width="250" height="52" rx="16"/>
  <text class="text" x="138" y="338">เลือกไฟล์ PDF</text>

  <rect class="panel" x="456" y="148" width="626" height="234" rx="24"/>
  <text class="label" x="486" y="190">ประวัติการส่งงานของกลุ่ม</text>
  <rect x="486" y="222" width="554" height="1" fill="#e5e7eb"/>
  <text class="small" x="486" y="260">วันที่ส่ง</text>
  <text class="small" x="646" y="260">งาน / ผู้ส่ง</text>
  <text class="small" x="820" y="260">สถานะ</text>
  <text class="small" x="956" y="260">หมายเหตุ</text>
  <rect x="486" y="286" width="120" height="56" rx="14" fill="#f8fafc"/>
  <text class="text" x="504" y="318">22/5/2569</text>
  <rect x="636" y="286" width="150" height="56" rx="14" fill="#f8fafc"/>
  <text class="text" x="654" y="318">โครงร่าง</text>
  <rect x="812" y="298" width="112" height="32" rx="16" fill="#fef3c7" stroke="#fbbf24"/>
  <text class="small" x="836" y="319" fill="#92400e">รอตรวจ</text>
  <rect class="blue" x="952" y="286" width="88" height="56" rx="14"/>
  <text class="text" x="973" y="318">-</text>

  <rect class="panel" x="88" y="430" width="994" height="196" rx="24"/>
  <text class="label" x="118" y="474">กรณีอาจารย์ไม่อนุมัติ</text>
  <rect class="rose" x="118" y="502" width="210" height="70" rx="18"/>
  <text class="text" x="142" y="532">สถานะ: ต้องแก้ไข</text>
  <text class="small" x="142" y="556">อ่านหมายเหตุให้ครบ</text>
  <rect class="blue" x="374" y="502" width="220" height="70" rx="18"/>
  <text class="text" x="396" y="532">กดส่งไฟล์แก้ไข</text>
  <text class="small" x="396" y="556">ระบบล็อกประเภทงานให้</text>
  <rect class="green" x="640" y="502" width="220" height="70" rx="18"/>
  <text class="text" x="662" y="532">อัปโหลดไฟล์ใหม่</text>
  <text class="small" x="662" y="556">สถานะกลับไปรอตรวจ</text>
  <rect class="soft" x="906" y="502" width="140" height="70" rx="18"/>
  <text class="text" x="938" y="532">เสร็จสิ้น</text>

  <circle class="orange" cx="394" cy="244" r="18"/><text class="call" x="388" y="250">1</text>
  <path class="line" d="M394 244 C438 232 452 214 484 196"/>
  <circle class="orange" cx="380" cy="340" r="18"/><text class="call" x="374" y="346">2</text>
  <path class="line" d="M380 340 C420 386 460 420 530 502"/>
  <circle class="orange" cx="1028" cy="282" r="18"/><text class="call" x="1022" y="288">3</text>
  <path class="line" d="M1028 282 C1100 290 1110 390 1040 502"/>

  <text class="small" x="88" y="672">คำอธิบาย: นักเรียนเลือกประเภทงาน แนบ PDF และตรวจสถานะจากตารางประวัติ หากไม่อนุมัติให้กดส่งไฟล์แก้ไขจากรายการเดิม</text>
</svg>
