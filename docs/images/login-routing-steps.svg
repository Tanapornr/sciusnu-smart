<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">ขั้นตอนเข้าสู่ระบบและแยกหน้าใช้งาน</title>
  <desc id="desc">แสดงการเข้าสู่ระบบและการพาไปยังหน้า student, advisor, viewer หรือ admin</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.head{fill:#f1f5f9}
      .box{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.orange{fill:#fff7ed;stroke:#fed7aa}.blue{fill:#eff6ff;stroke:#bfdbfe}.green{fill:#ecfdf5;stroke:#bbf7d0}.violet{fill:#f5f3ff;stroke:#ddd6fe}
      .title{font-family:Arial,sans-serif;font-size:30px;font-weight:800;fill:#111827}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:800;fill:#1f2937}.text{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}.small{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b}
      .n{font-family:Arial,sans-serif;font-size:15px;font-weight:800;fill:#fff}.dot{fill:#f97316}.arr{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="560"/>
  <rect class="panel" x="40" y="32" width="1020" height="496" rx="30"/>
  <rect class="head" x="40" y="32" width="1020" height="70" rx="30"/>
  <text class="title" x="76" y="78">ขั้นตอนเข้าสู่ระบบและแยกหน้าใช้งาน</text>

  <rect class="box" x="80" y="150" width="190" height="112" rx="22"/>
  <circle class="dot" cx="108" cy="184" r="16"/><text class="n" x="102" y="190">1</text>
  <text class="label" x="132" y="188">กรอกข้อมูล</text>
  <text class="text" x="104" y="224">รหัส/อีเมล และ</text><text class="text" x="104" y="248">รหัสผ่าน</text>

  <rect class="box" x="340" y="150" width="190" height="112" rx="22"/>
  <circle class="dot" cx="368" cy="184" r="16"/><text class="n" x="362" y="190">2</text>
  <text class="label" x="392" y="188">ตรวจบทบาท</text>
  <text class="text" x="364" y="224">อ่านข้อมูลจาก</text><text class="text" x="364" y="248">Google Sheet</text>

  <rect class="box" x="600" y="150" width="190" height="112" rx="22"/>
  <circle class="dot" cx="628" cy="184" r="16"/><text class="n" x="622" y="190">3</text>
  <text class="label" x="652" y="188">บันทึก session</text>
  <text class="text" x="624" y="224">เก็บ userRole</text><text class="text" x="624" y="248">ใน browser</text>

  <path class="arr" d="M272 206 H334"/><path class="arr" d="M532 206 H594"/>

  <rect class="orange" x="80" y="340" width="210" height="82" rx="20"/>
  <text class="label" x="118" y="376">student.html</text><text class="small" x="118" y="400">นักเรียนส่งงาน</text>
  <rect class="green" x="326" y="340" width="210" height="82" rx="20"/>
  <text class="label" x="360" y="376">advisor.html</text><text class="small" x="360" y="400">ที่ปรึกษาหลักตรวจงาน</text>
  <rect class="blue" x="572" y="340" width="210" height="82" rx="20"/>
  <text class="label" x="616" y="376">viewer.html</text><text class="small" x="616" y="400">ดูสถานะ Read-Only</text>
  <rect class="violet" x="818" y="340" width="210" height="82" rx="20"/>
  <text class="label" x="858" y="376">admin.html</text><text class="small" x="858" y="400">แอดมินตรวจคำร้อง</text>

  <path class="arr" d="M695 264 C680 315 190 300 185 334"/>
  <path class="arr" d="M695 264 C686 318 430 300 431 334"/>
  <path class="arr" d="M695 264 C704 318 676 300 677 334"/>
  <path class="arr" d="M695 264 C724 318 920 300 923 334"/>

  <text class="small" x="80" y="482">คำอธิบาย: หากอีเมลหรือรหัสผ่านใน Google Sheet ไม่ตรง ระบบอาจพาไปผิดหน้า หรือเข้าสู่ระบบไม่ได้</text>
</svg>
