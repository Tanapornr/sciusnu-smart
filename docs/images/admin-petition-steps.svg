<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">ขั้นตอนแอดมินตรวจแบบคำร้อง</title>
  <desc id="desc">แสดงขั้นตอนแบบคำร้องเข้าแอดมิน เปิดไฟล์ อนุมัติหรือไม่อนุมัติ และแจ้งอีเมล</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker>
  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.box{fill:#f5f3ff;stroke:#ddd6fe}.mail{fill:#eff6ff;stroke:#bfdbfe}.title{font-family:Arial,sans-serif;font-size:30px;font-weight:800;fill:#111827}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:800;fill:#1f2937}.text{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}.small{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b}.n{font-family:Arial,sans-serif;font-size:15px;font-weight:800;fill:#fff}.dot{fill:#7c3aed}.arr{stroke:#7c3aed;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1100" height="560"/><rect class="panel" x="40" y="32" width="1020" height="496" rx="30"/><text class="title" x="76" y="82">แอดมิน: ตรวจแบบคำร้อง</text>
  <rect class="box" x="82" y="145" width="190" height="118" rx="22"/><circle class="dot" cx="110" cy="179" r="16"/><text class="n" x="104" y="185">1</text><text class="label" x="134" y="183">คำร้องเข้า</text><text class="text" x="106" y="220">นักเรียนส่งแบบคำร้อง</text>
  <rect class="box" x="330" y="145" width="190" height="118" rx="22"/><circle class="dot" cx="358" cy="179" r="16"/><text class="n" x="352" y="185">2</text><text class="label" x="382" y="183">แอดมินเปิดไฟล์</text><text class="text" x="354" y="220">ตรวจ PDF คำร้อง</text>
  <rect class="box" x="578" y="145" width="190" height="118" rx="22"/><circle class="dot" cx="606" cy="179" r="16"/><text class="n" x="600" y="185">3</text><text class="label" x="630" y="183">พิจารณา</text><text class="text" x="602" y="220">อนุมัติ/ไม่อนุมัติ</text>
  <rect class="box" x="826" y="145" width="190" height="118" rx="22"/><circle class="dot" cx="854" cy="179" r="16"/><text class="n" x="848" y="185">4</text><text class="label" x="878" y="183">บันทึกผล</text><text class="text" x="850" y="220">อัปเดตสถานะ</text>
  <path class="arr" d="M276 204 H324"/><path class="arr" d="M524 204 H572"/><path class="arr" d="M772 204 H820"/>
  <rect class="mail" x="120" y="350" width="860" height="96" rx="20"/>
  <text class="label" x="150" y="386">อีเมลแจ้งเตือนของแบบคำร้อง</text>
  <text class="text" x="150" y="416">เมื่อส่งแบบคำร้อง: ระบบส่งอีเมลหา ADMIN_EMAILS ทุกคน และส่งอีเมลยืนยันให้นักเรียนในกลุ่ม</text>
  <text class="text" x="150" y="440">เมื่ออนุมัติแบบคำร้อง: ระบบแจ้งอาจารย์ที่ปรึกษาหลัก ร่วม และโรงเรียนเพื่อทราบ</text>
</svg>
