<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ภาพประกอบคู่มืออาจารย์ที่ปรึกษาหลัก</title>
  <desc id="desc">ภาพจำลองหน้าจอ advisor พร้อมปุ่มเปิดไฟล์ อนุมัติ ไม่อนุมัติ และช่องหมายเหตุ</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .screen { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; filter: url(#shadow); }
      .bar { fill: #f1f5f9; }
      .table { fill: #ffffff; stroke: #e5e7eb; }
      .row { fill: #ffffff; stroke: #eef2f7; }
      .note { fill: #eff6ff; stroke: #bfdbfe; }
      .status { fill: #fef3c7; stroke: #fbbf24; }
      .file { fill: #fff7ed; stroke: #fed7aa; }
      .approve { fill: #ecfdf5; stroke: #bbf7d0; }
      .reject { fill: #fff1f2; stroke: #fecdd3; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #111827; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #1f2937; }
      .text { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .small { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #64748b; }
      .green { fill: #059669; }
      .roseText { fill: #be123c; }
      .greenText { fill: #047857; }
      .call { font-family: Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
      .mark { fill: #4f46e5; }
      .line { stroke: #4f46e5; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect class="screen" x="48" y="40" width="1104" height="680" rx="34"/>
  <rect class="bar" x="48" y="40" width="1104" height="72" rx="34"/>
  <text class="title" x="88" y="88">คู่มืออาจารย์ที่ปรึกษาหลัก: ตรวจงาน</text>

  <rect class="table" x="82" y="148" width="1036" height="346" rx="24"/>
  <text class="label" x="112" y="190">ประวัติการส่งงานทั้งหมด</text>
  <rect x="112" y="220" width="976" height="1" fill="#e5e7eb"/>
  <text class="small" x="112" y="260">วันที่ส่ง</text>
  <text class="small" x="250" y="260">ข้อมูลผู้ส่ง</text>
  <text class="small" x="430" y="260">ประเภทงาน</text>
  <text class="small" x="588" y="260">หมายเหตุ</text>
  <text class="small" x="750" y="260">สถานะ</text>
  <text class="small" x="860" y="260">ไฟล์แนบ</text>
  <text class="small" x="990" y="260">ตรวจงาน</text>

  <rect class="row" x="112" y="288" width="976" height="132" rx="18"/>
  <text class="text" x="130" y="354">22/5/2569</text>
  <text class="text" x="250" y="338">13-SC-PC-01</text>
  <text class="small" x="250" y="364">68983244 ผู้ส่ง</text>
  <text class="text" x="430" y="354">โครงร่าง</text>
  <rect class="note" x="568" y="318" width="130" height="72" rx="16"/>
  <text class="text" x="590" y="350">แก้บทนำ</text>
  <text class="text" x="590" y="374">และอ้างอิง</text>
  <rect class="status" x="736" y="338" width="96" height="34" rx="17"/>
  <text class="small" x="760" y="359" fill="#92400e">รอตรวจ</text>
  <rect class="file" x="858" y="336" width="92" height="38" rx="19"/>
  <text class="small" x="878" y="360" fill="#c2410c">เปิดไฟล์</text>
  <rect class="approve" x="980" y="314" width="88" height="34" rx="17"/>
  <text class="small greenText" x="1000" y="336">อนุมัติ</text>
  <rect class="reject" x="980" y="360" width="88" height="34" rx="17"/>
  <text class="small roseText" x="994" y="382">ไม่อนุมัติ</text>

  <circle class="mark" cx="902" cy="318" r="18"/><text class="call" x="896" y="324">1</text>
  <path class="line" d="M902 318 C882 252 780 214 700 198"/>
  <text class="small" x="552" y="190">1. เปิดไฟล์ในแท็บใหม่เพื่อตรวจเนื้อหา</text>

  <circle class="mark" cx="1070" cy="314" r="18"/><text class="call" x="1064" y="320">2</text>
  <path class="line" d="M1070 314 C1110 250 1040 208 930 198"/>
  <text class="small" x="804" y="190">2. อนุมัติแล้วต้องยืนยันอีกครั้ง</text>

  <rect class="table" x="180" y="548" width="840" height="106" rx="24"/>
  <text class="label" x="218" y="586">เมื่อกดไม่อนุมัติ</text>
  <text class="text" x="218" y="618">ระบบจะเปิดกล่องให้กรอกหมายเหตุ นักเรียนจะเห็นข้อความนี้ในหน้าของตนเอง</text>
  <rect class="reject" x="800" y="580" width="150" height="42" rx="21"/>
  <text class="small roseText" x="828" y="606">ยืนยันไม่อนุมัติ</text>

  <text class="small" x="88" y="696">คำอธิบาย: ที่ปรึกษาหลักเป็นผู้ตรวจงานปกติ ปุ่มอนุมัติใช้กับงานที่ผ่าน ส่วนปุ่มไม่อนุมัติต้องใส่หมายเหตุให้นักเรียนแก้ไข</text>
</svg>
