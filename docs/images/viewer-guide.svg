<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ภาพประกอบคู่มืออาจารย์ที่ปรึกษาร่วมและที่ปรึกษาโรงเรียน</title>
  <desc id="desc">ภาพจำลองหน้า viewer ที่เป็นสิทธิ์อ่านอย่างเดียวและแสดงสถานะกับหมายเหตุ</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .screen { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; filter: url(#shadow); }
      .bar { fill: #f1f5f9; }
      .info { fill: #eff6ff; stroke: #bfdbfe; }
      .panel { fill: #ffffff; stroke: #e5e7eb; }
      .card { fill: #f8fafc; stroke: #e2e8f0; }
      .note { fill: #fff1f2; stroke: #fecdd3; }
      .status { fill: #fef3c7; stroke: #fbbf24; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #111827; }
      .label { font-family: Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #1f2937; }
      .text { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .small { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #64748b; }
      .blueText { fill: #1d4ed8; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <rect class="screen" x="48" y="40" width="1104" height="630" rx="34"/>
  <rect class="bar" x="48" y="40" width="1104" height="72" rx="34"/>
  <text class="title" x="88" y="88">คู่มือ Viewer: ที่ปรึกษาร่วม / ที่ปรึกษาโรงเรียน</text>

  <rect class="info" x="88" y="142" width="1024" height="74" rx="22"/>
  <text class="label blueText" x="120" y="178">สิทธิ์ Read-Only</text>
  <text class="text" x="120" y="202">ดูสถานะและหมายเหตุได้ แต่ไม่สามารถอนุมัติ ไม่อนุมัติ หรือดาวน์โหลดไฟล์ตรวจงาน</text>

  <rect class="panel" x="88" y="252" width="1024" height="330" rx="24"/>
  <text class="label" x="120" y="294">ประวัติการส่งงานทั้งหมด</text>
  <rect x="120" y="322" width="960" height="1" fill="#e5e7eb"/>
  <text class="small" x="120" y="360">วันที่ส่ง</text>
  <text class="small" x="300" y="360">ข้อมูลผู้ส่งและกลุ่ม</text>
  <text class="small" x="550" y="360">ประเภทงาน</text>
  <text class="small" x="744" y="360">หมายเหตุ</text>
  <text class="small" x="954" y="360">สถานะ</text>

  <rect class="card" x="120" y="390" width="150" height="72" rx="16"/>
  <text class="text" x="144" y="432">22/5/2569</text>
  <rect class="card" x="300" y="390" width="200" height="72" rx="16"/>
  <text class="text" x="322" y="422">13-SC-PC-01</text>
  <text class="small" x="322" y="446">68983244 ผู้ส่ง</text>
  <rect class="card" x="550" y="390" width="140" height="72" rx="16"/>
  <text class="text" x="570" y="432">โครงร่าง</text>
  <rect class="note" x="744" y="390" width="150" height="72" rx="16"/>
  <text class="text" x="768" y="422">แก้บทนำ</text>
  <text class="text" x="768" y="446">และอ้างอิง</text>
  <rect class="status" x="954" y="410" width="110" height="34" rx="17"/>
  <text class="small" x="984" y="431" fill="#92400e">รอตรวจ</text>

  <rect x="120" y="508" width="960" height="1" fill="#e5e7eb"/>
  <text class="text" x="120" y="548">ใช้หน้านี้เพื่อติดตามความคืบหน้าและดูหมายเหตุจากผู้ตรวจเท่านั้น</text>
  <text class="small" x="120" y="604">คำอธิบาย: หากต้องแก้ข้อมูลหรือสถานะ ให้แจ้งอาจารย์ที่ปรึกษาหลักหรือแอดมิน</text>
</svg>
