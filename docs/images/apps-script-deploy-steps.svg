<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">ขั้นตอน Deploy Google Apps Script</title>
  <desc id="desc">แสดงขั้นตอนแก้ Code.gs, deploy version ใหม่, คัดลอก URL และอัปเดตไฟล์ HTML</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563eb" stroke-width="2"/></marker>
  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#e5e7eb;stroke-width:1.4}.box{fill:#eff6ff;stroke:#bfdbfe}.warn{fill:#fff7ed;stroke:#fed7aa}.title{font-family:Arial,sans-serif;font-size:30px;font-weight:800;fill:#111827}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:800;fill:#1f2937}.text{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}.small{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b}.n{font-family:Arial,sans-serif;font-size:15px;font-weight:800;fill:#fff}.dot{fill:#2563eb}.arr{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1100" height="560"/><rect class="panel" x="40" y="32" width="1020" height="496" rx="30"/><text class="title" x="76" y="82">ขั้นตอนหลังแก้ Code.gs</text>
  <rect class="box" x="76" y="146" width="170" height="118" rx="22"/><circle class="dot" cx="104" cy="180" r="16"/><text class="n" x="98" y="186">1</text><text class="label" x="128" y="184">แก้ Code.gs</text><text class="text" x="100" y="222">บันทึกโค้ด</text>
  <rect class="box" x="292" y="146" width="170" height="118" rx="22"/><circle class="dot" cx="320" cy="180" r="16"/><text class="n" x="314" y="186">2</text><text class="label" x="344" y="184">Deploy</text><text class="text" x="316" y="222">New version</text>
  <rect class="box" x="508" y="146" width="170" height="118" rx="22"/><circle class="dot" cx="536" cy="180" r="16"/><text class="n" x="530" y="186">3</text><text class="label" x="560" y="184">คัดลอก URL</text><text class="text" x="532" y="222">Web App URL</text>
  <rect class="box" x="724" y="146" width="170" height="118" rx="22"/><circle class="dot" cx="752" cy="180" r="16"/><text class="n" x="746" y="186">4</text><text class="label" x="776" y="184">อัปเดต HTML</text><text class="text" x="748" y="222">ทุกไฟล์ที่ใช้ API</text>
  <rect class="box" x="940" y="146" width="110" height="118" rx="22"/><circle class="dot" cx="968" cy="180" r="16"/><text class="n" x="962" y="186">5</text><text class="label" x="972" y="184">Push</text><text class="text" x="964" y="222">รอ Vercel</text>
  <path class="arr" d="M250 205 H286"/><path class="arr" d="M466 205 H502"/><path class="arr" d="M682 205 H718"/><path class="arr" d="M898 205 H934"/>
  <rect class="warn" x="110" y="356" width="880" height="92" rx="20"/>
  <text class="label" x="140" y="392">ข้อควรจำ</text>
  <text class="text" x="140" y="422">ถ้าไม่ Deploy เป็น New version เว็บจะยังเรียก Apps Script เวอร์ชันเก่า แม้แก้ Code.gs แล้วก็ตาม</text>
  <text class="text" x="140" y="446">ถ้า URL Web App เปลี่ยน ต้องนำไปแทนใน index, student, advisor, viewer และ admin</text>
</svg>
