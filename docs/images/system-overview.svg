<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ภาพรวมการทำงานของระบบ SCIUSNU SMART</title>
  <desc id="desc">แผนภาพแสดงการเข้าสู่ระบบ การส่งงาน การเก็บข้อมูล และการตรวจงานตามบทบาทผู้ใช้</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; filter: url(#shadow); }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.3; }
      .card-blue { fill: #eff6ff; stroke: #bfdbfe; }
      .card-orange { fill: #fff7ed; stroke: #fed7aa; }
      .card-green { fill: #ecfdf5; stroke: #bbf7d0; }
      .card-rose { fill: #fff1f2; stroke: #fecdd3; }
      .card-gray { fill: #f8fafc; stroke: #e2e8f0; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #64748b; }
      .label { font-family: Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #1f2937; }
      .text { font-family: Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
      .small { font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; }
      .num { font-family: Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720" rx="0"/>
  <rect class="panel" x="42" y="38" width="1116" height="644" rx="34"/>

  <text class="title" x="82" y="94">ภาพรวมการทำงานของระบบ SCIUSNU SMART</text>
  <text class="subtitle" x="82" y="128">ระบบติดตามการส่งงาน ตรวจงาน และแจ้งสถานะตามบทบาทผู้ใช้งาน</text>

  <rect class="card card-gray" x="82" y="178" width="190" height="112" rx="22"/>
  <circle cx="110" cy="210" r="16" fill="#111827"/>
  <text class="num" x="104" y="216">1</text>
  <text class="label" x="136" y="212">เข้าสู่ระบบ</text>
  <text class="text" x="105" y="246">ระบบตรวจบทบาทจาก</text>
  <text class="text" x="105" y="269">Google Sheet</text>

  <rect class="card card-orange" x="336" y="178" width="190" height="112" rx="22"/>
  <circle cx="364" cy="210" r="16" fill="#ea580c"/>
  <text class="num" x="358" y="216">2</text>
  <text class="label" x="390" y="212">นักเรียนส่งงาน</text>
  <text class="text" x="359" y="246">เลือกประเภทงาน</text>
  <text class="text" x="359" y="269">และอัปโหลด PDF</text>

  <rect class="card card-blue" x="590" y="178" width="190" height="112" rx="22"/>
  <circle cx="618" cy="210" r="16" fill="#2563eb"/>
  <text class="num" x="612" y="216">3</text>
  <text class="label" x="644" y="212">บันทึกข้อมูล</text>
  <text class="text" x="613" y="246">ไฟล์เข้า Google Drive</text>
  <text class="text" x="613" y="269">สถานะเข้า Sheet</text>

  <rect class="card card-green" x="844" y="178" width="230" height="112" rx="22"/>
  <circle cx="872" cy="210" r="16" fill="#059669"/>
  <text class="num" x="866" y="216">4</text>
  <text class="label" x="898" y="212">ที่ปรึกษาหลักตรวจ</text>
  <text class="text" x="867" y="246">อนุมัติ หรือ ไม่อนุมัติ</text>
  <text class="text" x="867" y="269">พร้อมหมายเหตุ</text>

  <path class="arrow" d="M275 234 H330"/>
  <path class="arrow" d="M530 234 H584"/>
  <path class="arrow" d="M784 234 H838"/>

  <rect class="card card-green" x="180" y="390" width="230" height="128" rx="24"/>
  <text class="label" x="212" y="426">อนุมัติ</text>
  <text class="text" x="212" y="458">งานผ่านการตรวจ</text>
  <text class="text" x="212" y="482">นักเรียนและผู้เกี่ยวข้อง</text>
  <text class="text" x="212" y="506">เห็นสถานะอนุมัติ</text>

  <rect class="card card-rose" x="486" y="390" width="230" height="128" rx="24"/>
  <text class="label" x="518" y="426">ไม่อนุมัติ</text>
  <text class="text" x="518" y="458">ระบบแสดงหมายเหตุ</text>
  <text class="text" x="518" y="482">นักเรียนส่งไฟล์แก้ไข</text>
  <text class="text" x="518" y="506">และรอตรวจอีกครั้ง</text>

  <rect class="card card-blue" x="792" y="390" width="230" height="128" rx="24"/>
  <text class="label" x="824" y="426">Read-Only</text>
  <text class="text" x="824" y="458">ที่ปรึกษาร่วมและ</text>
  <text class="text" x="824" y="482">ที่ปรึกษาโรงเรียน</text>
  <text class="text" x="824" y="506">ดูสถานะได้เท่านั้น</text>

  <path class="arrow" d="M958 294 C958 344 336 334 300 384"/>
  <path class="arrow" d="M958 294 C958 350 632 342 604 384"/>
  <path class="arrow" d="M958 294 C958 344 918 352 912 384"/>

  <rect x="82" y="572" width="994" height="58" rx="18" fill="#f8fafc" stroke="#e5e7eb"/>
  <text class="small" x="108" y="607">หมายเหตุ: แบบคำร้องจะเข้าสู่ขั้นตอนแอดมินตรวจ ส่วนงานโครงงานปกติให้อาจารย์ที่ปรึกษาหลักเป็นผู้อนุมัติ</text>
</svg>
